<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Planner SaaS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; background:var(--bg);">

  <div style="background:var(--surface); padding:2.5rem; border-radius:var(--rl); border:1px solid var(--b); text-align:center; max-width:400px; width:90%;">
    <h2 style="font-family:'DM Mono', monospace; color:var(--tx); margin-bottom:0.5rem; font-size:18px;">Planejamento SaaS</h2>
    <p style="color:var(--tm); font-size:13px; margin-bottom:2rem;">Faça login com sua conta Google para acessar o painel.</p>
    
    <div id="google-button-container" style="display:flex; justify-content:center;"></div>
  </div>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
